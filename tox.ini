[tox]
min_version = 4.4
env_list = py310, py311, py312, py313

[testenv]
description = install TTS against the lock file for this interpreter and run one make target (default: test_text)
package = editable
extras = all
deps =
    -c requirements/lock-py{py_dot_ver}.txt
set_env =
    TRAINER_TELEMETRY = 0
    COQUI_TOS_AGREED = 1
    PIP_EXTRA_INDEX_URL = https://download.pytorch.org/whl/cpu
pass_env =
    CUDA_VISIBLE_DEVICES
    HOME
allowlist_externals = make
commands = make {posargs:test_text}

[testenv:lint]
description = style and lint checks
skip_install = true
deps =
    -r requirements.dev.txt
    -c requirements/lock-py{py_dot_ver}.txt
commands = make lint

[testenv:sast]
description = local security scanners
skip_install = true
deps = -r requirements.security.txt
commands = make sast
