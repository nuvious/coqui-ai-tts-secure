[build-system]
requires = [
    "setuptools",
    "wheel",
    "cython>=3.0",
    "numpy>=1.22.0",
    "packaging",
]

[flake8]
max-line-length=120

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
line_length = 120
profile = "black"
multi_line_output = 3

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Security rules only; style rules stay with black, isort and pylint.
select = ["S"]
ignore = [
    "S101",  # assert in library code is a documented accepted risk (see SECURITY.md)
    "S311",  # random is used for data augmentation and sampling, never for secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.bandit]
exclude_dirs = ["tests", "TTS/demos", "notebooks", "recipes", "docs"]
skips = [
    "B101",  # assert in library code is a documented accepted risk (see SECURITY.md)
    "B311",  # random is used for data augmentation and sampling, never for secrets
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
