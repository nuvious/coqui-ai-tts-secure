name: "Docker build and push"
on:
  pull_request:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

permissions:
  contents: read

jobs:
  docker-build:
    name: "Build and push Docker image"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ["amd64"]
        base:
        - "nvidia/cuda:11.8.0-base-ubuntu22.04" # GPU enabled
        - "python:3.11-slim" # CPU only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Docker tags, check VERSION file matches tag
        id: compute-tag
        env:
          MATRIX_BASE: ${{ matrix.base }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -ex
          base="ghcr.io/${OWNER,,}/tts"
          tags="" # PR build

          if [[ "$MATRIX_BASE" = "python:3.11-slim" ]]; then
            base="ghcr.io/${OWNER,,}/tts-cpu"
          fi

          if [[ "$REF_TYPE" = "branch" ]]; then
            tags="${base}:${REF_NAME},${base}:${SHA},"
          elif [[ "$REF_TYPE" = "tag" ]]; then
            VERSION="v$(cat TTS/VERSION)"
            if [[ "$REF_NAME" != "${VERSION}" ]]; then
              echo "Pushed tag does not match VERSION file. Aborting push."
              exit 1
            fi
            tags="${base}:${VERSION},${base}:latest,${base}:${SHA}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          build-args: "BASE=${{ matrix.base }}"
          tags: ${{ steps.compute-tag.outputs.tags }}
