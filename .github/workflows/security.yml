name: security

on:
  push:
    branches:
      - dev
      - main
      - feature/*
      - bugfix/*
      - feat/*
      - bug/*
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit the lock file
        env:
          PY: ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip pip-audit
          ignores=$(grep -vE '^\s*(#|$)' requirements/audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          # shellcheck disable=SC2086
          pip-audit --disable-pip --no-deps --progress-spinner off $ignores -r "requirements/lock-py${PY}.txt"

  sast:
    name: bandit, ruff, semgrep
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install scanners
        run: python -m pip install -r requirements.security.txt
      - name: Bandit
        run: |
          bandit -c pyproject.toml -r TTS -f sarif -o bandit.sarif || true
          bandit -c pyproject.toml -r TTS --severity-level medium --confidence-level medium
      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Ruff security rules
        run: ruff check --output-format github TTS
      - name: Semgrep
        run: semgrep scan --config p/python --config p/flask --config p/trailofbits --severity ERROR --error --metrics off TTS

  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy

  actions-hygiene:
    name: zizmor
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  api-compat:
    name: Public API compatibility (griffe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install griffe
        run: python -m pip install griffe
      - name: Check for public API breakage against the PR base
        run: griffe check TTS --against ${{ github.event.pull_request.base.sha }} --search . --verbose
