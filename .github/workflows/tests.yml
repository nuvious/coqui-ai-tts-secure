name: tests

on:
  push:
    branches:
      - dev
      - main
      - feature/*
      - bugfix/*
      - feat/*
      - bug/*
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRAINER_TELEMETRY: "0"
  COQUI_TOS_AGREED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.subset }} (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    if: "! contains(github.event.head_commit.message, '[ci skip]')"
    # Python 3.13 is experimental: the tts CLI segfaults at exit on the runner there (see SECURITY.md).
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        subset:
          - test_text
          - test_aux
          - data_tests
          - inference_tests
          - test_tts
          - test_tts2
          - test_vocoder
          - test_vc
          - test_xtts
          - test_zoo0
          - test_zoo1
          - test_zoo2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements/lock-py${{ matrix.python-version }}.txt"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc g++ espeak espeak-ng libsndfile1-dev libmecab-dev mecab
      - name: Install tox
        run: python -m pip install --upgrade pip tox tox-uv
      - name: Replace scarf urls
        run: |
          sed -i 's/https:\/\/coqui.gateway.scarf.sh\/hf\/bark\//https:\/\/huggingface.co\/erogol\/bark\/resolve\/main\//g' TTS/.models.json
          sed -i 's/https:\/\/coqui.gateway.scarf.sh\//https:\/\/github.com\/coqui-ai\/TTS\/releases\/download\//g' TTS/.models.json
      - name: Run ${{ matrix.subset }} through tox
        env:
          PY: ${{ matrix.python-version }}
          SUBSET: ${{ matrix.subset }}
        run: tox -e "py${PY//./}" -- "$SUBSET"
